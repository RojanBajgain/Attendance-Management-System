name: ams
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  image: ^4.3.0
  ionicons: ^0.2.2
  loading_overlay: ^0.4.2
  shared_preferences: ^2.3.2
  animated_text_kit: ^4.2.2
  animations: ^2.0.11
  bottom_bar_matu: ^1.5.0
  flutter_svg: ^2.0.17
  countdown_progress_indicator: ^0.1.3
  easy_date_timeline: ^1.1.3
  getwidget: ^4.0.0
  flutter_form_builder: ^9.5.0
  tap_to_expand: ^0.7.2
  image_picker: ^1.1.2
  material_dialogs: ^1.1.5
  get_storage: ^2.1.1
  http: ^1.3.0
  responsive_sizer: ^3.3.1
  get: ^4.6.6
  shimmer: ^3.0.0
  dropdown_button2: ^2.3.9
  intercepted_client: ^0.0.1
  intl: ^0.19.0
  path: ^1.9.0
  flutter_bloc: ^9.0.0
  http_interceptor: ^2.0.0
  path_provider: ^2.1.5
  dio: ^5.7.0
  obs: ^0.0.4
  shimmer_animation: ^2.2.2
  restart_app: ^1.3.2
  auto_size_text: ^3.0.0
  clock_loader: ^0.0.3
  loading_animation_widget: ^1.3.0
  double_to_words: ^0.0.4+1
  pdf: ^3.11.2
  printing: ^5.8.0
  font_awesome_flutter: ^10.8.0
  image_cropper: ^9.0.0
  geolocator: ^13.0.2
  permission_handler: ^12.0.0+1
  app_settings: ^5.2.0
  url_launcher: ^6.3.1
  file_picker: ^9.0.2
  flutter_downloader: ^1.12.0
  open_file: ^3.5.10
  web_socket_channel: ^3.0.2
  flutter_skeleton_ui: ^0.0.6
  flutter_launcher_icons: ^0.14.3
  provider: ^6.1.4
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  percent_indicator: ^4.2.5
  flutter_switch: ^0.3.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  tap_debouncer: ^2.2.0
  google_nav_bar: ^5.0.7
  animated_bottom_navigation_bar: ^1.4.0
  curved_navigation_bar: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
    - google_fonts/

  fonts:
    - family: Mukta
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
    #       - asset: fonts/Schyler-Italic.ttf
    #         style: italic
    - family: SF_Pro
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
